# Expected outcome for W-2/reject. Read by vet.sh; keys are one-line strings.
rule = "operands of -, *, /, % are numeric; operands of + are both numeric or both string (D5), never bool"
verdict = "reject"
code = "CCS8000"
count = "3"  # the code must appear at least this many times (one per reject site)
pending = "step 3"  # the hardening step (plan §5) that gates this row; judged only when vet.sh --through >= 3
