# Expected outcome for NS-2/reject. Read by vet.sh; keys are one-line strings.
rule = "coverage-empty: no offered representation covers the dimensional range"
verdict = "reject"
code = ""
flags = "--warnaserror"  # extra compile flags; a coverage finding is a Warning promoted under --warnaserror
pending = "step 8"  # the hardening step (plan §5) that gates this row; judged only when vet.sh --through >= 8
family = "numeric-selection"  # the code is allocated with the D3 mapping table (plan NS rows); until then an empty code means: any error CCS code
platform = "posit-only"  # no platform descriptor declares a posit-only representation set yet; the x86_64 descriptor stands in until step 8 lets a descriptor declare its representations, so this leaf cannot go green before then
